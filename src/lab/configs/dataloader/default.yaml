train:
  _target_: torch.utils.data.DataLoader
  batch_size: 64
  num_workers: 16
  pin_memory: true
  persistent_workers: true # keep the workers between the passes over the dataset (inf_loop)
  shuffle: true
  prefetch_factor: 2
  drop_last: true

test:
  _target_: torch.utils.data.DataLoader
  batch_size: 256
  num_workers: 4
  pin_memory: true
  shuffle: false
  prefetch_factor: 2
  drop_last: false
